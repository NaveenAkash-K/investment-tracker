name: Verify Investment Tracker

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-and-database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: tracker_test_password
          POSTGRES_DB: tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: tracker_test
      PGUSER: postgres
      PGPASSWORD: tracker_test_password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.21.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify application
        run: |
          npm test
          npm run typecheck
          npm run lint
          npm run build

      - name: Bootstrap Supabase-compatible database roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create schema auth;
          create table auth.users (
              id uuid primary key,
              raw_user_meta_data jsonb not null default '{}'::jsonb
          );
          create or replace function auth.uid() returns uuid language sql stable as $$
              select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          create or replace function auth.role() returns text language sql stable as $$
              select coalesce(
                  nullif(current_setting('request.jwt.claim.role', true), ''),
                  nullif(current_setting('role', true), 'none'),
                  current_user::text
              )
          $$;
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          grant usage on schema auth to anon, authenticated, service_role;
          grant select on auth.users to anon, authenticated, service_role;
          SQL

      - name: Apply the complete migration chain
        run: |
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Exercise contracts, old backups, and delivery recovery
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/postgres-second-rereview.sql
          psql -v ON_ERROR_STOP=1 -f tests/postgres-execution-safety.sql
